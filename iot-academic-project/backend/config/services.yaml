# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    app.event.Jwt_user_Listener:
        class: App\Event\Listener\JwtUserListener
        tags:
            - { name: 'kernel.event_listener', event: 'lexik_jwt_authentication_on_authentication_suceess', method: 'onauthenticationsuceess' }

    app.event.user_Listener:
        class: App\Event\Listener\UserListener
        tags:
            - { name: 'doctrine.event_listener', event: 'prePersist' }
